volumes:
  pg_data:
  static_backend:
  static_frontend:
  media:

services:
  db:
    image: postgres:13
    restart: always
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend/
    restart: always
    env_file: .env
    volumes:
      - static_backend:/app/collected_static/
      - media:/app/media/
      - ./data/:/app/data/
    depends_on:
      - db
  
  frontend:
    build: ./frontend/
    env_file: .env
    command: cp -r /app/build/. /app/static/
    volumes:
      - static_frontend:/app/static/
  
  gateway:
    build: ./nginx/
    restart: always
    ports:
      - "80:80"
    volumes:
      - static_frontend:/app/static/
      - static_backend:/app/collected_static/
      - media:/app/media/
    depends_on:
      - backend
      - frontend
